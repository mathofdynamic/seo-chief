name: Validate SEO Chief

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate rule database
        run: python scripts/validate_rules.py

      - name: Compile Python tooling
        run: python -m py_compile scripts/validate_rules.py scripts/audit_site.py

      - name: Smoke-test static audit CLI
        run: python scripts/audit_site.py --help >/dev/null
