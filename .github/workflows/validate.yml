name: Validate SEO Chief

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate rule database
        run: python scripts/validate_rules.py

      - name: Validate skill contract
        run: python scripts/validate_skill.py

      - name: Run skill regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compile validator
        run: python -m py_compile scripts/*.py tests/*.py
